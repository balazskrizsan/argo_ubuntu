name: PR e2e UAT stack (kind)

# Pipeline position:
#   PR -> GHA -> kind deploy -> (later) Playwright -> PASS/FAIL -> merge gate -> ArgoCD -> uat
# To make this a real merge gate, add the `Deploy SSP uat stack to kind` job
# as a required status check in the branch protection rules of `master`.
# PROD has its own sibling workflow: pr-e2e-prod-test.yaml.

on:
  pull_request:
    # Only run when the change can affect what ArgoCD deploys for the SSP
    # UAT stack: the shared app templates, the ubuntu_uat overlays, the
    # common manifests used by apps/common/ubuntu_uat (insecure-config +
    # secret-manager), the ubuntu_uat / ci_uat script overlays, or the SSP
    # uat Application itself. ubuntu_prod-only files are handled by
    # pr-e2e-prod-test.yaml; local-only changes trigger neither.
    paths:
      - 'src/app-groups/ssp/apps/*/templates/**'
      - 'src/app-groups/ssp/apps/*/ubuntu_uat/**'
      - 'src/app-groups/ssp/apps/common/insecure-config/**'
      - 'src/app-groups/ssp/apps/common/secret-manager/**'
      - 'src/app-groups/ssp/apps/common/ubuntu_uat/**'
      - 'src/app-groups/ssp/scripts/ubuntu_uat/**'
      - 'src/app-groups/ssp/scripts/ci_uat/**'
      - 'src/argo-apps/ubuntu/ssp-uat--ubuntu--app.yaml'
      - '.github/workflows/pr-e2e-uat-test.yaml'
      - '.github/ci/**'
      - 'e2e/**'
  workflow_dispatch:

env:
  K8S_NAMESPACE: ssp-ci-uat
  E2E_BASE_URL: https://smartscrumpoker.balazskrizsan.com

jobs:
  deploy-stack:
    name: Deploy SSP uat stack to kind
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # PRs carry new image tags inside apps/*/(*env*)/kustomization.yaml
      # image patches. We collect the NEW image value of every `image` patch
      # touched by the PR, and fall back to the `ubuntu_uat` overlay tags
      # for apps the PR did not change (CI_UAT runs the same images as
      # uat). Result is appended as an `images:` block to the ci_uat
      # kustomization (kustomize `images:` matches by repository name, so it
      # also overrides the tag set by the ubuntu_uat overlay).
      - name: Resolve image tags (PR diff -> ci_uat overlay)
        run: |
          set -euo pipefail
          declare -A TAGS

          grab() { grep -hoP 'value:\s*kbalazsworks/\S+' "$1" | sed 's/value:\s*//' || true; }

          # fallback: current tags from the ubuntu_uat overlays
          for f in src/app-groups/ssp/apps/*/ubuntu_uat/kustomization.yaml; do
            while read -r img; do
              TAGS["${img%%:*}"]="${img##*:}"
            done < <(grab "$f")
          done

          # PR overrides: new side (+) of every changed line inside the
          # ubuntu_uat overlays only (this workflow runs the uat stack,
          # so prod tags must not leak in). `local_*`-tagged builds bake the
          # dev-cluster hosts into the frontend JS bundle at build time, so
          # they cannot run here -> skipped.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            while read -r img; do
              case "$img" in
                *:local_*) continue ;;
              esac
              TAGS["${img%%:*}"]="${img##*:}"
            done < <(git diff "origin/${{ github.base_ref }}" HEAD \
                      -- 'src/app-groups/ssp/apps/*/ubuntu_uat/**' \
                         'src/app-groups/ssp/scripts/ubuntu_uat/**' \
                      | grep -hoP '^\+\s*-?\s*op:.*|(^\+\s*value:\s*kbalazsworks/\S+)' \
                      | grep -oP 'kbalazsworks/\S+' || true)
          fi

          {
            echo ""
            echo "# generated by pr-e2e-uat-test.yaml"
            echo "images:"
            for repo in "${!TAGS[@]}"; do
              echo "  - name: ${repo}"
              echo "    newTag: ${TAGS[$repo]}"
            done
          } >> src/app-groups/ssp/scripts/ci_uat/kustomization.yaml

          echo "== Effective images =="
          for repo in "${!TAGS[@]}"; do echo "${repo}:${TAGS[$repo]}"; done | sort

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: pr-e2e-uat
          config: .github/ci/kind-config.yaml

      - name: Install ingress-nginx (kind)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.1/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s

      - name: Create namespace and secrets
        env:
          # GitHub repo secret: the FULL Secret manifest (apiVersion/kind/
          # metadata/data). Must contain `cloud-secrets` (feeds the
          # secret-manager sops Job); may contain further Secret docs.
          SSP_SECRETS_YAML: ${{ secrets.SSP_SECRETS_YAML }}
        run: |
          set -euo pipefail
          kubectl create namespace "$K8S_NAMESPACE"

          # env-cert: ingresses terminate TLS with this secret.
          # Self-signed wildcard; Playwright must run with ignoreHTTPSErrors.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/tls.key -out /tmp/tls.crt \
            -subj "/CN=*.smartscrumpoker.balazskrizsan.com" \
            -addext "subjectAltName=DNS:*.smartscrumpoker.balazskrizsan.com,DNS:smartscrumpoker.balazskrizsan.com"
          kubectl -n "$K8S_NAMESPACE" create secret tls env-cert \
            --key /tmp/tls.key --cert /tmp/tls.crt

          # cloud-secrets (+ optional extra secrets) from the GitHub secret.
          if [ -z "${SSP_SECRETS_YAML}" ]; then
            echo "::error::SSP_SECRETS_YAML GitHub secret is empty"
            exit 1
          fi
          printf '%s\n' "$SSP_SECRETS_YAML" > /tmp/gha-secrets.yaml
          # Normalize metadata.namespace -> $K8S_NAMESPACE: the manifest is
          # typically copied from cloud-secrets-local.yaml, which carries
          # `namespace: ssp-local` and would fail `kubectl -n ssp-ci apply`.
          sed -i -E "s/^(  namespace: ).*/\1$K8S_NAMESPACE/" /tmp/gha-secrets.yaml
          kubectl -n "$K8S_NAMESPACE" apply -f /tmp/gha-secrets.yaml
          kubectl -n "$K8S_NAMESPACE" get secrets
          # cloud-secrets is OPTIONAL: if present, the sops Job below
          # (re)generates aws-services-secrets; if absent, the YAML above
          # must already contain aws-services-secrets.

      - name: Deploy SSP stack (kubectl apply -k)
        run: kubectl apply -k src/app-groups/ssp/scripts/ci_uat

      # sops Job: downloads the encrypted secret from S3, decrypts via GCP KMS,
      # creates `aws-services-secrets`. Only needed if `cloud-secrets` was in
      # SSP_SECRETS_YAML; otherwise aws-services-secrets is injected directly.
      - name: Wait for secret-manager Job (sops)
        run: |
          set -euo pipefail
          if ! kubectl -n "$K8S_NAMESPACE" get secret cloud-secrets >/dev/null 2>&1; then
            echo "cloud-secrets not provided -> skipping sops Job"
            kubectl -n "$K8S_NAMESPACE" delete job secret-manager-job --ignore-not-found
            kubectl -n "$K8S_NAMESPACE" get secret aws-services-secrets
            exit 0
          fi
          if ! kubectl -n "$K8S_NAMESPACE" wait \
              --for=condition=complete job/secret-manager-job --timeout=180s; then
            kubectl -n "$K8S_NAMESPACE" logs job/secret-manager-job --tail=100 || true
            exit 1
          fi
          kubectl -n "$K8S_NAMESPACE" get secret aws-services-secrets

      # `kubectl rollout status` has no timestamp option, so each line is
      # piped through `ts` (millisecond UTC prefix). pipefail keeps kubectl's
      # exit code. Timestamps can be correlated with the --timestamps pod logs
      # and events.log collected by the "Collect all pod logs" step below.
      - name: Wait for rollouts
        run: |
          set -euo pipefail
          ts() { while IFS= read -r l; do printf '%s %s\n' "$(date -u +%H:%M:%S.%3N)" "$l"; done; }
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/backend-psql   --timeout=180s 2>&1 | ts
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/ids-psql       --timeout=180s 2>&1 | ts
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/ids            --timeout=600s 2>&1 | ts
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/aws-services   --timeout=300s 2>&1 | ts
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/backend        --timeout=300s 2>&1 | ts
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/frontend       --timeout=180s 2>&1 | ts

      - name: Map hosts and smoke check
        run: |
          set -euo pipefail
          # CI_UAT runs the uat manifests/images, so the uat domains are
          # mapped to the kind ingress on the runner — the uat-baked frontend
          # JS and the ids issuer URL resolve unchanged.
          for h in \
            smartscrumpoker.balazskrizsan.com \
            api.smartscrumpoker.balazskrizsan.com \
            identity-service.smartscrumpoker.balazskrizsan.com \
            api--aws-services.smartscrumpoker.balazskrizsan.com; do
            grep -q "$h" /etc/hosts || echo "127.0.0.1 $h" | sudo tee -a /etc/hosts
          done

          echo "== frontend =="
          curl -sk -o /dev/null -w '%{http_code}\n' "$E2E_BASE_URL"
          echo "== ids discovery =="
          curl -sk "https://identity-service.smartscrumpoker.balazskrizsan.com/.well-known/openid-configuration" | head -c 400; echo

      - name: Playwright e2e
        if: hashFiles('e2e/**') != ''
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      # Videos are only recorded on retry attempts (video: 'on-first-retry'),
      # so test-results/ is empty on a clean pass -> if-no-files-found: ignore.
      - name: Upload Playwright results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-uat-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Debug dump on failure
        if: failure()
        run: |
          kubectl -n "$K8S_NAMESPACE" get pods -o wide || true
          kubectl -n "$K8S_NAMESPACE" get events --sort-by=.lastTimestamp | tail -40 || true
          echo "===== logs: secret-manager-job ====="
          kubectl -n "$K8S_NAMESPACE" logs job/secret-manager-job --tail=100 || true
          for d in backend backend-psql ids ids-psql aws-services frontend; do
            echo "===== logs: $d ====="
            kubectl -n "$K8S_NAMESPACE" logs "deployment/$d" --all-containers --tail=80 || true
          done

      # Runs on success AND failure, before the runner (and the kind cluster
      # with it) is torn down: dumps every non-system table of both postgres
      # pods. Output per table: first line is the table name, then psql's
      # fully bordered (-P border=2) ASCII table -- header row = column
      # names, below it the rows as stored in the database.
      - name: Dump SQL tables (ASCII)
        if: always()
        run: |
          set -uo pipefail
          for dep in backend-psql ids-psql; do
            echo "::group::$dep"
            kubectl -n "$K8S_NAMESPACE" exec -i "deploy/$dep" -- sh -s <<'EOSQL' || echo "dump failed for $dep"
          export PGPASSWORD="$POSTGRES_PASSWORD"
          for t in $(psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "SELECT tablename FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema') ORDER BY 1"); do
            echo "$t"
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P border=2 -c "SELECT * FROM \"$t\""
          done
          EOSQL
            echo "::endgroup::"
          done

      # Runs on success AND failure, before the runner (and the kind cluster
      # with it) is torn down: every pod log in every namespace is dumped to
      # e2e-pod-logs/<ns>/<pod>__<container>.log and uploaded as an artifact
      # (30-day retention) so it stays downloadable after the run.
      - name: Collect all pod logs to files
        if: always()
        run: |
          set -uo pipefail
          OUT=e2e-pod-logs
          mkdir -p "$OUT"

          kubectl get pods -A \
            -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{"\n"}{end}' \
          | while IFS=/ read -r ns pod; do
              mkdir -p "$OUT/$ns"
              containers=$(kubectl -n "$ns" get pod "$pod" \
                -o jsonpath='{.spec.initContainers[*].name} {.spec.containers[*].name}' 2>/dev/null || true)
              for c in $containers; do
                kubectl -n "$ns" logs "$pod" -c "$c" --timestamps \
                  > "$OUT/$ns/${pod}__${c}.log" 2>/dev/null || true
                kubectl -n "$ns" logs "$pod" -c "$c" --previous --timestamps \
                  > "$OUT/$ns/${pod}__${c}__previous.log" 2>/dev/null || true
              done
            done

          kubectl get events -A --sort-by=.lastTimestamp > "$OUT/events.log" 2>/dev/null || true
          kubectl get pods -A -o wide > "$OUT/pods.log" 2>/dev/null || true

          find "$OUT" -type f -empty -delete
          echo "== collected log files =="
          find "$OUT" -type f | sort

          # Also echo every log into the step output (collapsible groups), so a
          # single log can be read in the browser without downloading the zip.
          # Files >300KB are truncated to head+tail; full content stays in the
          # artifact.
          while IFS= read -r f; do
            echo "::group::$f"
            if [ "$(wc -c < "$f")" -gt 300000 ]; then
              head -n 300 "$f"
              echo "... [truncated in step output, full log in artifact] ..."
              tail -n 300 "$f"
            else
              cat "$f"
            fi
            echo "::endgroup::"
          done < <(find "$OUT" -type f | sort)

      - name: Upload pod logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pod-logs-uat-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: e2e-pod-logs/
          retention-days: 30
          if-no-files-found: ignore
