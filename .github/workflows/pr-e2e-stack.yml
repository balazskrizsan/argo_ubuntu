name: PR e2e stack (kind)

# Pipeline position:
#   PR -> GHA -> kind deploy -> (later) Playwright -> PASS/FAIL -> merge gate -> ArgoCD -> prod
# To make this a real merge gate, add the `Deploy SSP stack to kind` job as a
# required status check in the branch protection rules of `master`.

on:
  pull_request:
    paths:
      - 'src/app-groups/ssp/**'
      - '.github/workflows/pr-e2e-stack.yml'
      - '.github/ci/**'
  workflow_dispatch:

env:
  K8S_NAMESPACE: ssp-local
  E2E_BASE_URL: https://smartscrumpoker.localhost.balazskrizsan.com

jobs:
  deploy-stack:
    name: Deploy SSP stack to kind
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # PRs carry new image tags inside apps/*/(*env*)/kustomization.yaml
      # image patches. We collect the NEW image value of every `image` patch
      # touched by the PR, and fall back to the `local` overlay tags for apps
      # the PR did not change. Result is appended as an `images:` block to the
      # ci kustomization (kustomize `images:` matches by repository name, so it
      # also overrides the tag set by the local overlay patch).
      - name: Resolve image tags (PR diff -> ci overlay)
        run: |
          set -euo pipefail
          declare -A TAGS

          grab() { grep -hoP 'value:\s*kbalazsworks/\S+' "$1" | sed 's/value:\s*//' || true; }

          # fallback: current tags from the local overlays
          for f in src/app-groups/ssp/apps/*/local/kustomization.yaml; do
            while read -r img; do
              TAGS["${img%%:*}"]="${img##*:}"
            done < <(grab "$f")
          done

          # PR overrides: new side (+) of every changed line, any overlay
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            while read -r img; do
              TAGS["${img%%:*}"]="${img##*:}"
            done < <(git diff "origin/${{ github.base_ref }}" HEAD -- 'src/**/*.yaml' \
                      | grep -hoP '^\+\s*-?\s*op:.*|(^\+\s*value:\s*kbalazsworks/\S+)' \
                      | grep -oP 'kbalazsworks/\S+' || true)
          fi

          {
            echo ""
            echo "# generated by pr-e2e-stack.yml"
            echo "images:"
            for repo in "${!TAGS[@]}"; do
              echo "  - name: ${repo}"
              echo "    newTag: ${TAGS[$repo]}"
            done
          } >> src/app-groups/ssp/scripts/ci/kustomization.yaml

          echo "== Effective images =="
          for repo in "${!TAGS[@]}"; do echo "${repo}:${TAGS[$repo]}"; done | sort

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: pr-e2e
          config: .github/ci/kind-config.yaml

      - name: Install ingress-nginx (kind)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.1/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s

      - name: Create namespace and secrets
        run: |
          set -euo pipefail
          kubectl create namespace "$K8S_NAMESPACE"

          # env-cert: ingresses terminate TLS with this secret.
          # Self-signed wildcard; Playwright must run with ignoreHTTPSErrors.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/tls.key -out /tmp/tls.crt \
            -subj "/CN=*.localhost.balazskrizsan.com" \
            -addext "subjectAltName=DNS:*.localhost.balazskrizsan.com,DNS:localhost.balazskrizsan.com"
          kubectl -n "$K8S_NAMESPACE" create secret tls env-cert \
            --key /tmp/tls.key --cert /tmp/tls.crt

          # aws-services has a mandatory secretRef on `aws-services-secrets`.
          # The real one is produced by the secret-manager Job (S3 + sops);
          # in CI we apply the committed .dec.yaml instead.
          kubectl -n "$K8S_NAMESPACE" apply -f src/secerts/aws-services.prod.secrets.dec.yaml

      - name: Deploy SSP stack (kubectl apply -k)
        run: kubectl apply -k src/app-groups/ssp/scripts/ci

      - name: Wait for rollouts
        run: |
          set -euo pipefail
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/backend-psql   --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/ids-psql       --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/ids            --timeout=300s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/aws-services   --timeout=300s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/backend        --timeout=300s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/frontend       --timeout=180s

      - name: Map hosts and smoke check
        run: |
          set -euo pipefail
          for h in \
            smartscrumpoker.localhost.balazskrizsan.com \
            api--smartscrumpoker.localhost.balazskrizsan.com \
            ids--smartscrumpoker.localhost.balazskrizsan.com \
            api--aws-services--smartscrumpoker.localhost.balazskrizsan.com; do
            grep -q "$h" /etc/hosts || echo "127.0.0.1 $h" | sudo tee -a /etc/hosts
          done

          echo "== frontend =="
          curl -sk -o /dev/null -w '%{http_code}\n' "$E2E_BASE_URL"
          echo "== ids discovery =="
          curl -sk "https://ids--smartscrumpoker.localhost.balazskrizsan.com/.well-known/openid-configuration" | head -c 400; echo

      # ---- step 2 of the epic: real Playwright tests land here --------------
      - name: Playwright e2e (placeholder)
        if: hashFiles('e2e/**') != ''
        run: |
          echo "TODO: npm ci && npx playwright test (baseURL: $E2E_BASE_URL, ignoreHTTPSErrors: true)"

      - name: Debug dump on failure
        if: failure()
        run: |
          kubectl -n "$K8S_NAMESPACE" get pods -o wide || true
          kubectl -n "$K8S_NAMESPACE" get events --sort-by=.lastTimestamp | tail -40 || true
          for d in backend backend-psql ids ids-psql aws-services frontend; do
            echo "===== logs: $d ====="
            kubectl -n "$K8S_NAMESPACE" logs "deployment/$d" --all-containers --tail=80 || true
          done
