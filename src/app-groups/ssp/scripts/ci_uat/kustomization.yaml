apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ---------------------------------------------------------------------------
# CI_UAT overlay for the GitHub Actions PR pipeline (kind cluster).
#
# Runs the SAME app manifests as `scripts/ubuntu_uat` — identical image tags
# and environment variables — so the e2e gate tests what actually ships to
# UAT. Only CI-infra deltas remain:
#   - namespace `ssp-ci-uat` (isolated namespace in the throwaway cluster).
#   - `env-cert` is a self-signed `*.smartscrumpoker.balazskrizsan.com` cert
#     created by the workflow; the runner maps the UAT domains to 127.0.0.1,
#     so the uat-baked frontend/ids config resolves to the kind ingress
#     unchanged.
#   - frontend ingress gets a `tls` block: prod terminates TLS upstream and
#     the template ships none, but kind/ingress-nginx needs it for HTTPS.
#   - ids readiness/liveness probes shortened (template periodSeconds: 300
#     would delay readiness past the rollout timeout in CI).
#   - backend-psql / ids-psql get a pg_isready readinessProbe (the templates
#     ship none, and the workflow needs a rollout signal).
#   - ids `AwsServices__FullUrl` is patched to the in-cluster Service
#     (http://aws-services:4074/): the uat value resolves via pod DNS to the
#     REAL public IP, so pod-side calls would egress to live UAT.
#   - secret-manager-rbac.yaml: the Job uses the `default` SA; the repo's
#     cluster-config cannot be reused (its kustomization references a
#     non-existent apps/common/templates dir).
#   - fluent-bit/ubuntu_uat IS deployed for parity; its logstash output
#     (logstash.elk.svc.cluster.local) does not exist in kind, so it retries
#     in the background — pod logs are dumped by the workflow anyway.
#
# Image tags: the workflow appends an `images:` block to this file at runtime,
# resolved from the PR diff (uat overlays) with `ubuntu_uat` tags as fallback.
# ---------------------------------------------------------------------------
namespace: ssp-ci-uat

resources:
  - namespace-config.yaml
  - secret-manager-rbac.yaml
  - ../../apps/common/ubuntu_uat
  - ../../apps/fluent-bit/ubuntu_uat
  - ../../apps/aws-services/ubuntu_uat
  - ../../apps/identity-service/ubuntu_uat
  - ../../apps/backend/ubuntu_uat
  - ../../apps/frontend/ubuntu_uat

generatorOptions:
  disableNameSuffixHash: true

patches:
  # Prod terminates TLS upstream (no tls in the frontend ingress template);
  # kind needs it for HTTPS.
  - target: { group: "networking.k8s.io", version: "v1", kind: "Ingress", name: "frontend" }
    patch: |-
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - smartscrumpoker.balazskrizsan.com
            secretName: env-cert

  # The backend's WS handshake allowed-origin check reads FRONTEND_FULL_HOST
  # (the old ci overlay set it explicitly; prod overlays never set it). With
  # the uat domain it matches the browser's Origin header — without it the
  # SockJS/STOMP handshake is rejected with 403.
  - target: { group: "", version: "v1", kind: "ConfigMap", name: "backend-config" }
    patch: |-
      - op: add
        path: /data/FRONTEND_FULL_HOST
        value: "https://smartscrumpoker.balazskrizsan.com/"

  # ids -> aws-services must stay in-cluster in kind: the uat value
  # (https://api--aws-services.smartscrumpoker.balazskrizsan.com/) resolves
  # via pod DNS to the REAL public IP, so QuickRegister's call would egress
  # to real UAT and fail introspection there. Internal Service name instead
  # (port 4074 is set by the ubuntu_uat overlay).
  - target: { group: "", version: "v1", kind: "ConfigMap", name: "ids-config" }
    patch: |-
      - op: replace
        path: /data/AwsServices__FullUrl
        value: "http://aws-services:4074/"

  - target: { group: "apps", version: "v1", kind: "Deployment", name: "ids" }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet:
            path: /.well-known/openid-configuration
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          httpGet:
            path: /.well-known/openid-configuration
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 10

  - target: { group: "apps", version: "v1", kind: "Deployment", name: "backend-psql" }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          exec:
            command: ["pg_isready", "-h", "localhost", "-p", "5432"]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60

  - target: { group: "apps", version: "v1", kind: "Deployment", name: "ids-psql" }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          exec:
            command: ["pg_isready", "-h", "localhost", "-p", "5432"]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
