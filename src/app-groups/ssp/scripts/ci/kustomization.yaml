apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ---------------------------------------------------------------------------
# CI overlay for the GitHub Actions PR pipeline (kind cluster, ubuntu-latest).
#
# Same app set as `scripts/local`, with these differences:
#   - NO cert-manager / secret-manager Jobs -> they would need real AWS S3
#     (certificate download) and GCP KMS (sops decrypt) access, which we do
#     not want inside GHA. The workflow creates `env-cert` (self-signed,
#     *.localhost.balazskrizsan.com) and `aws-services-secrets` itself.
#   - namespace-config ConfigMap is skipped (only consumed by those Jobs).
#   - fluent-bit is KEPT: identity-service/local patches the fluent-bit-env
#     ConfigMap, so removing it would break `kubectl apply -k`.
#   - Namespace stays `ssp-local`: aws-services/local hardcodes
#     `ids.ssp-local.svc.cluster.local` in OIDC_INTROSPECTION_URI.
#
# Image tags: the workflow appends an `images:` block to this file at runtime,
# resolved from the PR diff (any overlay) with `local` tags as fallback.
# ---------------------------------------------------------------------------
namespace: ssp-local

resources:
  - ../../apps/common/insecure-config
  - ../../apps/fluent-bit/local
  - ../../apps/aws-services/local
  - ../../apps/identity-service/local
  - ../../apps/backend/local
  - ../../apps/frontend/local
