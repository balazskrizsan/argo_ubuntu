# Minimal RBAC for the secret-manager Job in CI.
# The Job runs with the `default` ServiceAccount and kubectl-applies the
# decrypted `aws-services-secrets` Secret into this namespace.
# (The real cluster-config under scripts/local cannot be reused: its
# kustomization references a non-existent ../../../apps/common/templates dir.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-secret-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-secret-manager
subjects:
  - kind: ServiceAccount
    name: default
roleRef:
  kind: Role
  name: ci-secret-manager
  apiGroup: rbac.authorization.k8s.io
