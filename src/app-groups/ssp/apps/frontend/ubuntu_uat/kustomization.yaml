apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ssp-uat

resources:
  - ../templates

patches:
  - target: { group: "apps",  version: "v1", kind: "Deployment", name: "frontend" }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: kbalazsworks/smart_scrum_poker_v2_frontend:prod_commit_sha_short_e4ae39b

  - target: { group: "", version: "v1", kind: "Service", name: "frontend" }
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 4034

  - target: { group: "networking.k8s.io",  version: "v1", kind: "Ingress", name: "frontend" }
    patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/port/number
        value: 4034

      - op: replace
        path: /spec/rules/0/host
        value: smartscrumpoker.balazskrizsan.com
