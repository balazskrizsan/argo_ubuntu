apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ssp-uat

resources:
  - ssp--backend--uat--psql--persistent-volume.yaml
  - ssp--backend--uat--psql--persistent-volume-claim.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: backend-config
    namespace: ssp-uat
    literals:
      - NATIVE_REFLECTION_CONFIGURATION_GENERATOR_ENABLED=false
      - SERVER_ENV=UAT
      - SERVER_PORT=8080
      - SERVER_SOCKET_FULL_HOST=wss://api.smartscrumpoker.balazskrizsan.com/ws
      - SERVER_SSL_ENABLED=false
      - SERVER_SSL_KEY_STORE=classpath:keystore/certificate.p12
      - SERVER_SSL_KEY_STORE_PASSWORD=password
      - SITE_DOMAIN=smartscrumpoker.balazskrizsan.com
      - SITE_FRONTEND_HOST=https://smartscrumpoker.balazskrizsan.com/
      - SOCKET_IS_ENABLED_SOCKET_CONNECT_AND_DISCONNECT_LISTENERS=true
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=10
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=10
      - SPRING_DATASOURCE_PASSWORD=admin_pass
      - SPRING_DATASOURCE_URL=jdbc:postgresql://backend-psql-service:4014/app_db
      - SPRING_DATASOURCE_USERNAME=admin
      - LOGBACK_LOG_TYPE=JSON
      - LOGBACK_LOGSTASH_ENABLED=false
      - LOGBACK_LOGSTASH_FULL_HOST=
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://ids:4044
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://ids:4044/.well-known/openid-configuration/jwks
      - IDS_API_BASE_URL=http://ids:4044
