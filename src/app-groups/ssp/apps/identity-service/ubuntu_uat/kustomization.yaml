apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ssp-uat

resources:
  - app-config
  - ../templates

patches:
  - target: { group: "apps", version: "v1", kind: "Deployment", name: "ids" }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: kbalazsworks/smart_scrum_poker_v2_identity_service:commit_sha_short_1b66781

  - target: { group: "", version: "v1", kind: "Service", name: "ids" }
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort

      - op: replace
        path: /spec/ports/0/port
        value: 4044

      - op: add
        path: /spec/ports/0/nodePort
        value: 30405

  - target: { group: "networking.k8s.io",  version: "v1", kind: "Ingress", name: "ids" }
    patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/port/number
        value: 4044

      - op: replace
        path: /spec/rules/0/host
        value: identity-service.smartscrumpoket.krizsanbalazs.com

      - op: add
        path: /spec/tls
        value:
          - hosts:
              - identity-service.smartscrumpoket.krizsanbalazs.com
            secretName: env-cert

  - target: { group: "apps", version: "v1", kind: "Deployment", name: "ids" }
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: ssp--ids--uat--dp-persistent-volume-claim

### PSQL

  - target: { group: "", version: "v1", kind: "Service", name: "ids-psql-service" }
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 4054

  - target: { group: "", version: "v1", kind: "Service", name: "ids-psql-service" }
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort

  - target: { group: "apps", version: "v1", kind: "Deployment", name: "ids-psql" }
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: ssp--ids--uat--psql--persistent-volume-claim

### Fluent Bit

  - target: { group: "", version: "v1", kind: "ConfigMap", name: "fluent-bit-env" }
    patch: |-
      - op: replace
        path: /data/app_name
        value: ids
