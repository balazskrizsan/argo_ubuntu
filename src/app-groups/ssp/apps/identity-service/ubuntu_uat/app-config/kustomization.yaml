apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ssp-uat

resources:
  - ssp--ids--uat--psql--persistent-volume.yaml
  - ssp--ids--uat--psql--persistent-volume-claim.yaml
  - ssp--ids--uat--dp-persistent-volume.yaml
  - ssp--ids--uat--dp-persistent-volume-claim.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: ids-config
    namespace: ssp-uat
    literals:
      - Certificate__Password=password
      - Certificate__Path=keystore/certificate.pfx
      - Certificate__UseHttps=false
      - ConnectionStrings__DefaultConnection="Host=ids-psql-service;Port=4054;Database=app_db;Username=admin;Password=admin_pass"
      - IdentityServer__FrontendCorsOrigin=https://smartscrumpoket.krizsanbalazs.com
      - IdentityServer__FrontendRedirectUri=https://smartscrumpoket.krizsanbalazs.com/auth-callback
      - IdentityServer__IssuerUri=https://identity-service.smartscrumpoket.krizsanbalazs.com/
      - IdentityServer__Port=8080
      - IdentityServer_ForceHttpsRewrite=true
      - Logging__AppName=ssp_identity_service
      - Logging__LogstashEnabled=false
      - Logging__LogstashHost=disabled
      - Logging__LogstashPort=1111
      - Logging__LogType=JSON
      - ASPNETCORE_ENVIRONMENT=UAT
      - AwsServices__FullUrl=https://api--aws-services.smartscrumpoket.krizsanbalazs.com/
      - Cookie__Domain=.smartscrumpoket.krizsanbalazs.com
